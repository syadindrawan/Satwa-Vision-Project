# nixpacks.toml
# Konfigurasi eksplisit untuk Railway (Nixpacks), karena project ini
# campuran Python (Flask/TensorFlow) + Node.js (Tailwind CLI build).
#
# CATATAN: `pip` tidak otomatis ada di PATH hanya dengan menambahkan
# paket "python310" — makanya kemarin muncul "pip: command not found".
# Solusinya: selalu panggil lewat "python3 -m pip" (bukan "pip" polos),
# itu dijamin ada selama python3-nya sendiri ada.
#
# GANTI "requirements.txt" di bawah kalau nama file kamu berbeda
# (misalnya "requirements-backend.txt").

[phases.setup]
nixPkgs = ["python310", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt",
  "npm install"
]

[phases.build]
cmds = [
  "npx tailwindcss -i ./static/style/input.css -o ./static/style/style.css --minify"
]

[start]
# $PORT disediakan otomatis oleh Railway saat runtime — JANGAN di-hardcode ke 5000
cmd = "python3 -m gunicorn app:app --bind 0.0.0.0:$PORT"