# nixpacks.toml
# Konfigurasi eksplisit untuk Railway (Nixpacks), karena project ini
# campuran Python (Flask/TensorFlow) + Node.js (Tailwind CLI build).
#
# CATATAN PENTING soal pip di lingkungan Nix:
# - JANGAN pakai `ensurepip` — itu mencoba menulis ke /nix/store yang
#   immutable, dan akan selalu gagal ("externally-managed-environment").
# - Solusinya: minta Nix menyediakan `pip` langsung sebagai paket jadi
#   (python310Packages.pip), lalu pakai flag --break-system-packages
#   saat pip install (aman di sini karena ini environment build sekali
#   pakai, bukan OS asli yang perlu dilindungi).
#
# GANTI "requirements.txt" di bawah kalau nama file kamu berbeda
# (misalnya "requirements-backend.txt").

[phases.setup]
nixPkgs = ["python310", "python310Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m pip install --break-system-packages --upgrade pip",
  "python3 -m pip install --break-system-packages -r requirements-backend.txt",
  "npm install"
]

[phases.build]
cmds = [
  "npx tailwindcss -i ./static/style/input.css -o ./static/style/style.css --minify"
]

[start]
# $PORT disediakan otomatis oleh Railway saat runtime — JANGAN di-hardcode ke 5000
cmd = "python3 -m gunicorn app:app --bind 0.0.0.0:$PORT"