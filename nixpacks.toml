# nixpacks.toml
#
# PENTING: sengaja TIDAK ada [phases.install] di sini. Biarkan Nixpacks
# pakai Python auto-detector bawaannya (dari requirements.txt) — itu
# sudah menyiapkan python + pip + venv dengan benar secara internal.
# Kalau kita override manual (python310 + python310Packages.pip sebagai
# paket terpisah), keduanya TIDAK otomatis tersambung, makanya kemarin
# selalu muncul "No module named pip" walau paketnya sudah ada.
#
# Di sini kita cuma menambahkan Node.js (untuk build Tailwind CSS) di
# atas auto-detect Python itu, tanpa mengganggu proses pip-nya sama sekali.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.build]
cmds = [
  "npm install",
  "npx tailwindcss -i ./static/style/input.css -o ./static/style/style.css --minify"
]

[start]
# $PORT disediakan otomatis oleh Railway saat runtime — JANGAN di-hardcode ke 5000
# gunicorn harus ada di requirements.txt (mis. gunicorn>=21.2)
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"