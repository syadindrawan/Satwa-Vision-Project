# nixpacks.toml
#
# Kenapa dibuat manual & eksplisit begini (bukan mengandalkan auto-detect
# Nixpacks lagi): sempat terjadi mismatch antara python3 yang dipakai
# untuk `pip install` (di-setup otomatis oleh Nixpacks) dengan python3
# yang dipanggil di start command (python3 mentah dari nix) — dua
# environment yang beda isi package-nya, makanya gunicorn "ketemu"
# waktu install tapi "hilang" waktu dijalankan.
#
# Fix-nya: bikin SATU virtual environment sendiri (/opt/venv), lalu
# install & jalankan app selalu lewat venv yang sama persis. venv juga
# aman dari masalah "externally-managed-environment" ala Nix, karena
# venv menulis ke folder biasa (/opt/venv), bukan ke /nix/store yang
# immutable.

[phases.setup]
nixPkgs = ["python310", "nodejs_20"]
# nixLibs menambahkan shared library ke LD_LIBRARY_PATH (bukan ke PATH
# seperti nixPkgs biasa). TensorFlow butuh libstdc++.so.6 (dari
# stdenv.cc.cc.lib) dan libz.so.1 (dari zlib) yang TIDAK otomatis ada
# di environment Nix — tanpa ini muncul error
# "ImportError: libstdc++.so.6: cannot open shared object file".
nixLibs = ["stdenv.cc.cc.lib", "zlib"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "npm install"
]

[phases.build]
cmds = [
  "npx tailwindcss -i ./static/style/input.css -o ./static/style/style.css --minify"
]

[start]
# $PORT disediakan otomatis oleh Railway saat runtime — JANGAN di-hardcode ke 5000
# Selalu pakai python & gunicorn dari /opt/venv yang sama dengan saat install,
# BUKAN "python3"/"gunicorn" polos (itu yang bikin mismatch kemarin).
cmd = "/opt/venv/bin/python -m gunicorn app:app --bind 0.0.0.0:$PORT"